<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Lifelong Learning banner" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#16213e"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#7aa2ff" stroke-opacity="0.08"/>
  </pattern>
  <linearGradient id="accent" x1="0" x2="1">
    <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/>
  </linearGradient>
</defs>
<rect width="1200" height="240" rx="14" fill="url(#bg)"/>
<rect width="1200" height="240" rx="14" fill="url(#grid)"/>
<text x="60" y="90" font-size="70" fill="#ffffff" opacity="0.06" font-family="Georgia,serif">∑</text><text x="980" y="80" font-size="90" fill="#ffffff" opacity="0.06" font-family="Georgia,serif">∫</text><text x="1090" y="200" font-size="64" fill="#ffffff" opacity="0.06" font-family="Georgia,serif">λ</text><text x="820" y="210" font-size="56" fill="#ffffff" opacity="0.06" font-family="Georgia,serif">π</text><text x="150" y="215" font-size="52" fill="#ffffff" opacity="0.06" font-family="Georgia,serif">∇</text><text x="700" y="70" font-size="48" fill="#ffffff" opacity="0.06" font-family="Georgia,serif">⊕</text>
<text x="70" y="108" font-size="54" font-weight="700" fill="#ffffff">Lifelong Learning</text>
<rect x="70" y="124" width="120" height="4" rx="2" fill="url(#accent)"/>
<text x="70" y="164" font-size="20" fill="#c9d4f0">Sources, not platforms. Fundamentals before specialization.</text>
<text x="70" y="196" font-size="14" fill="#8b9bc4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Computer Science · Mathematics · Physics · Machine Learning</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
