name: stats
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bahia
      STATS_OUT: ${{ runner.temp }}/stats
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate dashboard
        run: python tools/stats.py
      - name: Publish to the stats branch
        working-directory: ${{ runner.temp }}/stats
        run: |
          git init -q -b stats
          git config user.name "github-actions"
          git config user.email "41898282+github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(stats): update dashboard"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            stats
