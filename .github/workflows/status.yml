name: stats
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "attachments/stats/**"
      - "README.md"
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the dashboard needs the full history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate dashboard
        run: python tools/stats.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attachments/stats README.md
          git diff --cached --quiet || git commit -m "chore(stats): update dashboard"
          git push
